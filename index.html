<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Anime Clash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one arcade cabinet screen, pixel canvas scaled to fit, a strip of key hints underneath. */
:root{
  --bg:#08070f; --cab:#14112a; --edge:#2c2650; --fg:#ece8ff; --muted:#8f88b8; --p1:#ff4a4a; --p2:#3a9aff;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;
  font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#game{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:3px solid var(--edge);box-shadow:0 0 0 3px var(--cab),0 0 40px rgba(90,60,200,.35);max-width:100%}
.keys{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;color:var(--muted);text-align:center}
.keys b{color:var(--fg);font-weight:600}
.keys .a{color:var(--p1)} .keys .b{color:var(--p2)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#game{touch-action:none}
/* touch controls: stick + 5 attack buttons per player, sized to the shorter screen side */
#touch{--b:clamp(46px,8.5vmin,72px);--stick:clamp(104px,20vmin,160px);width:100%;max-width:1280px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding-bottom:env(safe-area-inset-bottom,0px)}
#touch button{font:700 calc(var(--b)*.36)/1 ui-monospace,Menlo,monospace;color:#fff;border:3px solid #0b0914;border-radius:10px;cursor:pointer;touch-action:none;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.25),0 3px 0 #0b0914;-webkit-tap-highlight-color:transparent}
#touch button.on{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.2);filter:brightness(1.3)}
.pad{display:flex;align-items:center;gap:16px}
#touch.solo .pad{display:contents}
#touch.solo .stick{order:0}#touch.solo .mid{order:1}#touch.solo .btns{order:2}
#touch.duo .pad{order:0}#touch.duo .mid{order:1}#touch.duo #pad2{order:2}
.stick{position:relative;flex:none;width:var(--stick);height:var(--stick);border-radius:50%;background:radial-gradient(circle,#231d44 0 45%,#171230 46%);border:3px solid var(--edge);box-shadow:0 0 0 3px var(--cab);touch-action:none}
.stick::before{content:"";position:absolute;inset:10%;border-radius:50%;background:
  linear-gradient(#5a50a0,#5a50a0) 50% 0/14% 10% no-repeat,linear-gradient(#5a50a0,#5a50a0) 50% 100%/14% 10% no-repeat,
  linear-gradient(#5a50a0,#5a50a0) 0 50%/10% 14% no-repeat,linear-gradient(#5a50a0,#5a50a0) 100% 50%/10% 14% no-repeat}
.nub{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:#3a3270;border:3px solid #8a80d0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);pointer-events:none}
.btns{display:grid;grid-template-columns:repeat(6,calc(var(--b)/2));grid-auto-rows:var(--b);gap:8px}
.btns button{grid-column:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.btns button.big{grid-column:span 3}
.btns b{font-size:1em}.btns i{font-style:normal;font-size:.5em;letter-spacing:.06em;opacity:.9}
.sig{background:#7a4ad0}.spc{background:#2a7ad8}.sup{background:#8a7a20}.lit{background:#5a5a78}.hvy{background:#c8302a}
.sup.ready{background:#f2c21a;color:#1a1200!important;animation:glow .5s steps(2) infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px #fff6a0,0 0 18px #ffe84a}}
.mid{display:flex;flex-direction:column;gap:8px;align-items:center}
.sys{background:#2c2650;font-size:calc(var(--b)*.3)!important;min-width:calc(var(--b)*1.1);height:calc(var(--b)*.75)}
.menu{display:flex;gap:16px;justify-content:center;width:100%}
.menu button{background:#c8302a;font-size:clamp(16px,3.4vmin,28px)!important;padding:.7em 1.4em}
.menu button+button{background:#2a7ad8}.menu button+button+button{background:#3a9a4a}
@media (prefers-reduced-motion:reduce){.sup.ready{animation:none}}
#screen{position:relative;container-type:inline-size;max-width:100%;flex:none}
#screen #game{display:block}
#online{position:absolute;inset:3px;display:flex;align-items:center;justify-content:center;background:rgba(8,6,20,.82);font:600 clamp(11px,2.1cqw,17px)/1.35 ui-monospace,Menlo,Consolas,monospace;color:var(--fg);overflow:auto}
.ocard{width:min(92%,760px);display:flex;flex-direction:column;gap:.8em;padding-block:1em}
.ohead{display:flex;justify-content:space-between;align-items:baseline;gap:1em;flex-wrap:wrap}
#online h2{margin:0;color:#ffe84a;font-size:1.6em;letter-spacing:.08em}
#online h3{margin:.2em 0 .4em;color:var(--muted);font-size:.85em;text-transform:uppercase;letter-spacing:.12em}
#ostatus{margin:0;font-size:.85em;color:#ffd27a}#ostatus[data-state="ok"]{color:#7ee08a}
#oerr{margin:0;padding:.5em .8em;border:2px solid #ff4a4a;background:rgba(255,74,74,.12);color:#ffb0b0}
.ocols{display:grid;grid-template-columns:1fr 1fr;gap:1.4em}
.ocols section{min-width:0;display:flex;flex-direction:column;gap:.4em}
.ochk{display:flex;gap:.5em;align-items:center;color:var(--fg);font-size:.9em}
.obtn{font:inherit;font-weight:700;color:#fff;background:#2c2650;border:3px solid #0b0914;border-radius:8px;padding:.55em 1em;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 3px 0 #0b0914}
.obtn:hover:not(:disabled){filter:brightness(1.2)}.obtn:active:not(:disabled){transform:translateY(2px)}
.obtn:disabled{opacity:.45;cursor:default}.obtn:focus-visible,#ocode:focus-visible{outline:3px solid #ffe84a;outline-offset:2px}
.obtn.red{background:#c8302a}.obtn.blue{background:#2a7ad8}.obtn.ghost{background:transparent;border-color:var(--edge);box-shadow:none;align-self:flex-start;color:var(--muted)}
.ojoin{display:flex;gap:.5em}
#ocode{font:inherit;font-size:1.3em;letter-spacing:.3em;width:6.5em;min-width:0;text-transform:uppercase;background:#0b0914;color:#fff;border:3px solid var(--edge);border-radius:8px;padding:.3em .5em}
#olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4em;max-height:9em;overflow:auto}
#olist li{display:flex;align-items:center;gap:.8em;padding:.35em .6em;background:#1a1536;border:2px solid var(--edge);border-radius:8px}
#olist li b{font-size:1.2em;letter-spacing:.2em;color:#fff}#olist li span{flex:1;color:var(--muted);font-size:.85em}
#olist li button{font:inherit;font-weight:700;color:#fff;background:#2a7ad8;border:2px solid #0b0914;border-radius:6px;padding:.25em .7em;cursor:pointer}
#olist li.empty{color:var(--muted);background:none;border-style:dashed;font-weight:400}
#owait{display:flex;flex-direction:column;align-items:center;gap:.5em;text-align:center}
#owait p{margin:0;max-width:40ch}
#obig{font-size:3.4em;letter-spacing:.3em;color:#ffe84a;padding-left:.3em;user-select:all}
.opulse{color:#8ac0ff;animation:opulse 1.2s steps(2) infinite}@keyframes opulse{50%{opacity:.4}}
.orow{display:flex;gap:.8em;flex-wrap:wrap;justify-content:center}
@media (max-width:640px){.ocols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.opulse{animation:none}}
</style>
</head>
<body>
<div id="screen">
<canvas id="game" width="320" height="180" tabindex="0" aria-label="Anime Clash fighting game"></canvas>
<div id="online" hidden>
  <div class="ocard">
    <div class="ohead"><h2>ONLINE BATTLE</h2><p id="ostatus" data-state="wait">Connecting…</p></div>
    <p id="oerr" role="alert" hidden></p>
    <div id="ohome">
      <div class="ocols">
        <section>
          <h3>Host a room</h3>
          <label class="ochk"><input type="checkbox" id="opub" checked> List it in the lobby</label>
          <button type="button" id="ocreate" class="obtn red">CREATE ROOM</button>
          <h3>Join with a code</h3>
          <div class="ojoin"><input id="ocode" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code"><button type="button" id="ojoin" class="obtn blue">JOIN</button></div>
        </section>
        <section>
          <h3>Lobby</h3>
          <ul id="olist"></ul>
        </section>
      </div>
    </div>
    <div id="owait" hidden>
      <h3>Room code</h3>
      <div id="obig"></div>
      <p id="owaitnote"></p>
      <p class="opulse">Waiting for an opponent…</p>
      <div class="orow"><button type="button" id="ocopy" class="obtn blue">COPY CODE</button><button type="button" id="ocancel" class="obtn">CLOSE ROOM</button></div>
    </div>
    <button type="button" id="oback" class="obtn ghost">BACK TO TITLE</button>
  </div>
</div>
</div>
<div class="keys">
  <span><span class="a">P1</span> <b>WASD</b> move/jump · <b>1 2 3 4 5</b> attacks</span>
  <span><span class="b">P2</span> <b>Arrows</b> · <b>6 7 8 9 0</b> (or Numpad 1-5)</span>
  <span><b>1</b>/<b>6</b> signature · <b>2</b>/<b>7</b> special · <b>3</b>/<b>8</b> super · <b>4</b>/<b>9</b> light · <b>5</b>/<b>0</b> heavy</span>
  <span>Hold <b>back</b> to block · <b>P</b> pause · <b>M</b> mute</span>
</div>
<div id="touch" hidden>
  <div class="pad" id="pad1">
    <div class="stick" data-p="1" aria-label="P1 move stick"><span class="nub"></span></div>
    <div class="btns"><button type="button" class="sig" data-code="Digit1" aria-label="P1 SIG"><b>1</b><i>SIG</i></button><button type="button" class="spc" data-code="Digit2" aria-label="P1 SPC"><b>2</b><i>SPC</i></button><button type="button" class="sup" data-code="Digit3" aria-label="P1 SUP"><b>3</b><i>SUP</i></button><button type="button" class="lit big" data-code="Digit4" aria-label="P1 LIGHT"><b>4</b><i>LIGHT</i></button><button type="button" class="hvy big" data-code="Digit5" aria-label="P1 HEAVY"><b>5</b><i>HEAVY</i></button></div>
  </div>
  <div class="mid" id="tmid">
    <button type="button" class="sys" data-code="Escape" aria-label="Pause or back">II</button>
    <button type="button" class="sys" data-code="KeyQ" id="tquit" hidden>QUIT</button>
    <button type="button" class="sys" data-code="KeyM" aria-label="Mute">&#9835;</button>
  </div>
  <div class="pad" id="pad2">
    <div class="stick" data-p="2" aria-label="P2 move stick"><span class="nub"></span></div>
    <div class="btns"><button type="button" class="sig" data-code="Digit6" aria-label="P2 SIG"><b>6</b><i>SIG</i></button><button type="button" class="spc" data-code="Digit7" aria-label="P2 SPC"><b>7</b><i>SPC</i></button><button type="button" class="sup" data-code="Digit8" aria-label="P2 SUP"><b>8</b><i>SUP</i></button><button type="button" class="lit big" data-code="Digit9" aria-label="P2 LIGHT"><b>9</b><i>LIGHT</i></button><button type="button" class="hvy big" data-code="Digit0" aria-label="P2 HEAVY"><b>0</b><i>HEAVY</i></button></div>
  </div>
  <div class="menu" id="tmenu">
    <button type="button" data-code="Digit1">VS CPU</button>
    <button type="button" data-code="Digit2">2 PLAYERS</button>
    <button type="button" data-code="Digit3">ONLINE</button>
  </div>
</div>

    if(first){const n=m.count||1;for(let k=0;k<n;k++)strikes.push({x:o.x+(k?(k%2?1:-1)*k*16:0),delay:m.warn+k*8,life:16,owner:f,dmg:m.dmg/n,w:m.width||10,color:m.color,done:false,sup:!!m.super});sfx('proj');}
    break;}
  case 'aoe':{
    if(first){f.groupHit=false;for(let k=0;k<(m.count||5);k++)for(const s of[-1,1])erupts.push({x:f.x+s*(18+k*22),delay:k*5,life:20,w:18,h:m.height||44,owner:f,dmg:m.dmg,color:m.color,sup:!!m.super});shake=4;}
    break;}
  }
  f.mt++;
  if(f.mt>=st+ac+m.rc){f.state=f.onGround?'idle':'jump';f.move=null;f.trail=[];}
}

function threatened(o){
  if(o.state==='attack'&&o.mt<o.move.st+o.move.ac)return true;
  return projectiles.some(p=>p.owner===o)||strikes.some(s=>s.owner===o)||erupts.some(e=>e.owner===o);
}

function updateFighter(f,o,inp){
  f.inp=inp;f.t++;if(f.flash>0)f.flash--;if(f.inv>0)f.inv--;if(f.showCombo>0)f.showCombo--;
  if(f.buffer&&--f.buffer.t<=0)f.buffer=null;
  for(let i=0;i<5;i++)if(inp.atk[i]){f.buffer={i,t:8};break;}
  f.guard=false;
  if(f.state==='attack'){
    if(f.buffer&&f.hitConnected&&f.mi<=1&&f.buffer.i>=2&&startMove(f,f.buffer.i))f.buffer=null;
    else updateAttack(f,o);
  }else if(f.state==='hurt'){
    if(--f.stun<=0&&f.onGround){f.state='idle';f.combo=0;}
  }else if(f.state==='block'){
    if(--f.stun<=0)f.state='idle';
  }else if(f.state==='ko'||f.state==='win'){
  }else{
    if(f.onGround)f.facing=o.x>=f.x?1:-1;
    if(f.buffer&&startMove(f,f.buffer.i)){f.buffer=null;updateAttack(f,o);}
    else if(f.onGround){
      const mv=(inp.right?1:0)-(inp.left?1:0);const back=mv!==0&&mv===-f.facing;
      if(back&&threatened(o)){f.guard=true;f.vx=0;f.state='idle';}
      else{f.vx=mv*f.ch.stats.spd*1.3*(back?.75:1);f.state=mv?'walk':'idle';}
      if(inp.up){f.vy=-6*f.ch.stats.jump;f.onGround=false;f.vx=mv*f.ch.stats.spd*1.5;f.state='jump';sfx('jump');}
    }else f.state='jump';
  }
  // physics
  const hover=f.state==='attack'&&f.move&&(f.move.type==='beam'||f.move.type==='proj'||f.move.type==='sky'||f.move.type==='aoe')&&!f.onGround;
  if(!f.onGround&&!hover)f.vy+=GRAV;
  f.x+=f.vx;f.y+=f.vy;
  if(f.y>=GROUND){
    if(!f.onGround){if(f.state==='jump')f.state='idle';if(f.state==='ko'){f.vx*=.5;burst(f.x,GROUND,'#c8b89a',6,1.5);shake=Math.max(shake,2);}}
    f.y=GROUND;f.vy=0;f.onGround=true;
  }else f.onGround=false;
  if(f.onGround&&f.state!=='walk')f.vx*=.82;
  if(f.ghost>f.hp){f.ghost=Math.max(f.hp,f.ghost-(f.state==='hurt'?.15:.6));}
  clampX(f);
}

function pushApart(a,b){
  if(a.state==='ko'||b.state==='ko')return;
  const dx=b.x-a.x,minD=(a.w+b.w)/2*.8;
  if(Math.abs(dx)<minD&&Math.abs(a.y-b.y)<30){const s=dx>0?1:dx<0?-1:(a.side?-1:1),p=(minD-Math.abs(dx))/2;a.x-=s*p;b.x+=s*p;clampX(a);clampX(b);}
}

function updateProjectiles(){
  for(const p of projectiles){
    p.x+=p.vx;p.life--;p.age++;
    if(p.kind==='fire'&&p.age%2===0)parts.push({x:p.x-Math.sign(p.vx)*p.r,y:p.y+(Math.random()-.5)*p.r,vx:-p.vx*.3,vy:-.5,life:12,c:Math.random()<.5?'#ff7a1a':'#ffd23a',s:2,g:-.02});
    if(p.kind==='bolt'&&p.age%3===0)parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:8,c:'#fff8a0',s:1,g:0});
    const t=other(p.owner);
    const box={x:p.x-p.r,y:p.y-p.r,w:p.r*2,h:p.r*2};
    if(p.tick>0)p.tick--;
    else if(ov(box,hurtBox(t))&&t.state!=='ko'&&t.inv<=0){
      hit(p.owner,t,p.dmg,{kb:p.hits>1?.1:p.kb,lift:p.hits>1?0:p.lift,src:p.x-p.vx*4,sup:p.sup,stun:p.hits>1?16:undefined,col:p.color});
      p.hits--;p.tick=6;if(p.hits>0)p.vx*=.15;
      if(p.hits<=0){p.dead=true;burst(p.x,p.y,p.color,12,3);}
    }
    if(p.x<-30||p.x>W+30||p.life<=0)p.dead=true;
  }
  for(let i=0;i<projectiles.length;i++)for(let j=i+1;j<projectiles.length;j++){
    const a=projectiles[i],b=projectiles[j];if(a.dead||b.dead||a.owner===b.owner)continue;
    if(Math.abs(a.x-b.x)<a.r+b.r&&Math.abs(a.y-b.y)<a.r+b.r){
      if(a.sup&&!b.sup){b.dead=true;}else if(b.sup&&!a.sup){a.dead=true;}else{a.dead=b.dead=true;}
      burst((a.x+b.x)/2,(a.y+b.y)/2,'#ffffff',14,3);sfx('block');
    }
  }
  projectiles=projectiles.filter(p=>!p.dead);
  for(const s of strikes){
    if(s.delay>0){s.delay--;if(s.delay===0){sfx('thunder');whiteFlash=Math.max(whiteFlash,s.sup?6:3);shake=Math.max(shake,s.sup?6:3);}continue;}
    s.life--;const t=other(s.owner);
    if(!s.done&&s.life>6&&ov({x:s.x-s.w/2,y:0,w:s.w,h:GROUND},hurtBox(t))){s.done=true;hit(s.owner,t,s.dmg,{kb:3,lift:6,src:s.x,sup:s.sup,col:s.color});}
    if(s.life%3===0)burst(s.x,GROUND-2,s.color,3,2);
  }
  strikes=strikes.filter(s=>s.life>0);
  for(const e of erupts){
    if(e.delay>0){e.delay--;continue;}
    e.life--;const t=other(e.owner);
    if(!e.owner.groupHit&&e.life>8&&ov({x:e.x-e.w/2,y:GROUND-e.h,w:e.w,h:e.h},hurtBox(t))){e.owner.groupHit=true;hit(e.owner,t,e.dmg,{kb:4,lift:7,src:e.owner.x,sup:e.sup,col:'#ffd23a'});}
    if(e.life===19){sfx('fire');}
    if(e.life%2===0)parts.push({x:e.x+(Math.random()-.5)*e.w,y:GROUND-Math.random()*e.h,vx:0,vy:-1.5,life:10,c:Math.random()<.5?'#ffd23a':'#ff5a1a',s:2,g:0});
  }
  erupts=erupts.filter(e=>e.life>0&&e.x>-20&&e.x<W+20);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;}
  parts=parts.filter(p=>p.life>0);
}

/* ---------- CPU ---------- */
function reach(f,m){switch(m.type){case 'melee':case 'multi':return f.w/2+m.range;case 'dash':return m.dash*m.ac*.7+m.range;case 'uppercut':return m.range+12;case 'beam':return m.len;case 'aoe':return 140;default:return 999;}}
function aiInput(me,o){
  const inp={left:false,right:false,up:false,down:false,atk:[false,false,false,false,false]};
  if(G.phase!=='play'||o.state==='ko')return inp;
  const A=me.ai||(me.ai={cd:40,think:0,move:0,blockFor:0,jump:false});
  const d=Math.abs(o.x-me.x),to=o.x>me.x?1:-1;
  const set=dir=>{if(dir>0)inp.right=true;else if(dir<0)inp.left=true;};
  if(A.cd>0)A.cd--;
  const incoming=(o.state==='attack'&&o.mt<o.move.st+o.move.ac&&d<reach(o,o.move)+12)||projectiles.some(p=>p.owner===o&&Math.abs(p.x-me.x)<80&&Math.sign(me.x-p.x)===Math.sign(p.vx))||strikes.some(s=>s.owner===o);
  if(incoming&&me.state!=='attack'&&A.blockFor===0){A.blockFor=Math.random()<.6?20:-14;if(A.blockFor<0&&Math.random()<.3&&me.onGround)inp.up=true;}
  if(A.blockFor>0){A.blockFor--;set(-to);return inp;}
  if(A.blockFor<0)A.blockFor++;
  const ms=me.ch.moves;
  if(me.meter>=100&&A.cd===0&&Math.random()<.04&&d<reach(me,ms[4])){inp.atk[4]=true;A.cd=60;return inp;}
  if(A.cd===0&&me.state!=='attack'){
    const opts=[];
    for(let i=0;i<4;i++){if(reach(me,ms[i])>=d){opts.push(i);if(i<2&&d<40)opts.push(i,i);}}
    if(opts.length&&Math.random()<(d<45?.22:.035)){inp.atk[opts[Math.random()*opts.length|0]]=true;A.cd=18+Math.random()*36|0;return inp;}
  }
  if(--A.think<=0){A.think=10+Math.random()*20|0;A.move=d>36?(Math.random()<.85?1:0):(Math.random()<.3?-1:Math.random()<.5?0:1);A.jump=Math.random()<.07;}
  set(A.move*to);if(A.jump){inp.up=true;A.jump=false;}
  return inp;
}

/* ---------- online multiplayer ---------- */
// Both players run the same deterministic fight. Each side sends only its inputs, scheduled
// NET.D frames ahead, and a frame is simulated once both inputs for it have arrived.
const DEFAULT_SERVER='wss://anime-clash-9hbh.onrender.com';
const NET={ws:null,status:'off',side:0,code:'',pub:true,rooms:[],D:4,frame:0,gen:0,local:{},remote:{},remoteMax:-1,pend:0,
  stage:0,remoteCur:0,rtts:[],rsums:{},stalled:0,remoteLock:false,rematch:[false,false],sums:{},desync:false,retry:0,msg:'',inRoom:false,peer:false};
function serverURL(){
  try{const q=new URLSearchParams(location.search).get('server');if(q)return q;}catch(_){}
  if(/^https?:$/.test(location.protocol)&&!/github\.io$/.test(location.hostname)&&location.host)return(location.protocol==='https:'?'wss://':'ws://')+location.host;
  return DEFAULT_SERVER;
}
function netSend(m){if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(m));}
const relay=d=>netSend({t:'r',d});
function netConnect(){
  if(NET.ws&&NET.ws.readyState<2)return;
  NET.status='connecting';uiOnline();
  let ws;try{ws=new WebSocket(serverURL());}catch(e){NET.status='off';NET.msg='Could not reach the game server.';uiOnline();return;}
  NET.ws=ws;
  ws.onopen=()=>{NET.status='online';NET.retry=0;NET.msg='';netSend({t:'list'});uiOnline();};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}netMsg(m);};
  ws.onclose=()=>{
    const wasPlaying=NET.inRoom;NET.ws=null;NET.status='off';NET.inRoom=false;NET.peer=false;
    if(wasPlaying&&G.mode==='online'&&G.screen!=='online'){G.screen='online';NET.msg='Lost the connection to the server.';}
    if(G.screen==='online'&&NET.retry<30){NET.retry++;NET.status='connecting';setTimeout(netConnect,3000);}
    uiOnline();
  };
}
function netLeave(){if(NET.inRoom)netSend({t:'leave'});NET.inRoom=false;NET.peer=false;NET.code='';}
function goOnline(msg){G.mode='online';G.screen='online';NET.msg=msg||'';netConnect();netSend({t:'list'});uiOnline();}
function netMsg(m){
  switch(m.t){
  case 'lobby':NET.rooms=m.rooms||[];uiLobby();break;
  case 'created':NET.rtts=[];NET.code=m.code;NET.side=0;NET.inRoom=true;NET.peer=false;NET.msg='';uiOnline();break;
  case 'joined':NET.rtts=[];NET.code=m.code;NET.side=1;NET.inRoom=true;NET.peer=true;NET.msg='';onlineSelect();break;
  case 'peer':NET.peer=true;sfx('confirm');onlineSelect();break;
  case 'peerLeft':NET.inRoom=false;NET.peer=false;NET.code='';G.mode='online';G.screen='online';NET.msg='Your opponent left the match.';uiOnline();break;
  case 'err':NET.msg=m.msg;if(G.screen==='online')uiOnline();break;
  case 'r':netGame(m.d);break;
  }
}
function netGame(d){
  if(!d)return;
  switch(d.t){
  case 'i':NET.remote[d.f]=d.b;if(d.f>NET.remoteMax)NET.remoteMax=d.f;break;
  case 'cur':NET.remoteCur=d.c;if(G.sel)G.sel.c[1-NET.side]=d.c;break;
  case 'lock':NET.remoteLock=d.l;NET.remoteCur=d.c;if(G.sel){G.sel.c[1-NET.side]=d.c;G.sel.done[1-NET.side]=d.l;}if(d.l)sfx('confirm');break;
  case 'start':beginOnlineMatch(d.stage,d.c,d.D);break;
  case 'png':relay({t:'pon',ts:d.ts});break;
  case 'pon':NET.rtts.push(performance.now()-d.ts);if(NET.rtts.length>8)NET.rtts.shift();break;
  case 'rematch':NET.rematch[1-NET.side]=true;break;
  case 'reselect':onlineSelect();break;
  case 'sum':{NET.rsums[d.f]=d.h;const mine=NET.sums[d.f];if(mine!=null&&mine!==d.h)NET.desync=true;break;}
  }
}
function onlineSelect(){
  G.mode='online';G.screen='select';
  const mine=G.sel?G.sel.c[NET.side]:G.last[0];
  G.sel={c:[0,1],done:[false,false],go:0};G.sel.c[NET.side]=mine;G.sel.c[1-NET.side]=NET.remoteCur;
  NET.remoteLock=false;relay({t:'cur',c:mine});uiOnline();
}
function stepOnlineSelect(){
  const S=G.sel,me=NET.side,maps=[MAP.p1,MAP.p2];
  if(S.go){if(--S.go===0&&me===0){const stage=Math.random()*STAGES.length|0,c=[...S.c];const D=calcDelay();relay({t:'start',stage,c,D});beginOnlineMatch(stage,c,D);}return;}
  if(pressed.Escape){if(S.done[me]){S.done[me]=false;relay({t:'lock',c:S.c[me],l:false});}else{netLeave();goOnline();}return;}
  if(!S.done[me]){
    let c=S.c[me];
    if(navP(maps,'left'))c=(c+9)%10;if(navP(maps,'right'))c=(c+1)%10;if(navP(maps,'up')||navP(maps,'down'))c=(c+5)%10;
    if(c!==S.c[me]){S.c[me]=c;sfx('select');relay({t:'cur',c});}
    if(okP(maps)){S.done[me]=true;sfx('confirm');relay({t:'lock',c:S.c[me],l:true});}
  }
  if(S.done[0]&&S.done[1]&&me===0)S.go=30;
}
function pingMs(){if(!NET.rtts.length)return null;const a=[...NET.rtts].sort((x,y)=>x-y);return a[a.length>>1]/2;}
// input delay covers one trip from this player to the rival through the server, plus a frame of slack
function calcDelay(){const ms=pingMs();return ms==null?8:Math.max(3,Math.min(20,Math.ceil(ms/(1000/60))+1));}
function beginOnlineMatch(stage,c,D){
  NET.D=D||8;NET.stage=stage;G.sel={c:[...c],done:[true,true],go:0};G.last=[c[NET.side],c[1-NET.side]];
  NET.frame=0;NET.gen=NET.D-1;NET.local={};NET.remote={};NET.remoteMax=NET.D-1;NET.pend=0;NET.sums={};NET.rsums={};NET.desync=false;NET.stalled=0;NET.rematch=[false,false];
  for(let f=0;f<NET.D;f++){NET.local[f]=0;NET.remote[f]=0;}
  G.screen='vs';G.vsT=0;G.leaveAsk=0;
}
const ATK_BITS=16|32|64|128|256;
function encodeInput(r){let b=(r.left?1:0)|(r.right?2:0)|(r.up?4:0)|(r.down?8:0);for(let i=0;i<5;i++)if(r.atk[i])b|=16<<i;return b;}
function decodeInput(b){return{left:!!(b&1),right:!!(b&2),up:!!(b&4),down:!!(b&8),atk:[0,1,2,3,4].map(i=>!!(b&(16<<i)))};}
function stateSum(){let h=G.phaseT*7+G.timer*131+G.round*977;for(const f of G.f)h=(h*31+Math.round(f.x*16)+Math.round(f.y*16)*3+Math.round(f.hp*64)*7+Math.round(f.meter)*11)%1000000007;return h;}
function netFightTick(){
  const li=readInput([MAP.p1,MAP.p2]);
  NET.pend|=encodeInput(li)&ATK_BITS;
  if(pressed.Escape)G.leaveAsk=G.leaveAsk?0:240;
  if(G.leaveAsk){G.leaveAsk--;if(pressed.KeyQ){netLeave();goOnline('You left the match.');return;}}
  const ahead=NET.remoteMax-NET.frame,runs=ahead>NET.D+2?3:1;
  for(let n=0;n<runs;n++){
    const target=NET.frame+NET.D;
    if(NET.gen<target){NET.gen=target;const b=(encodeInput(li)&15)|NET.pend;NET.pend=0;NET.local[target]=b;relay({t:'i',f:target,b});}
    const rb=NET.remote[NET.frame];
    if(rb===undefined){NET.stalled=(NET.stalled||0)+1;return;}
    NET.stalled=0;
    const lb=NET.local[NET.frame];delete NET.local[NET.frame];delete NET.remote[NET.frame];
    NET.inputs=NET.side===0?[lb,rb]:[rb,lb];
    stepFight();
    if(NET.frame%120===0&&G.screen==='fight'){const h=stateSum();NET.sums[NET.frame]=h;relay({t:'sum',f:NET.frame,h});if(NET.rsums[NET.frame]!=null&&NET.rsums[NET.frame]!==h)NET.desync=true;}
    NET.frame++;
    if(G.screen!=='fight')return;
  }
}
function stepOnlineResult(){
  G.resT++;
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;}parts=parts.filter(p=>p.life>0);
  if(G.resT<=30)return;
  const me=NET.side;
  if(!NET.rematch[me]&&(pressed.Enter||pressed.Digit1||pressed.Digit6||pressed.Numpad1||pressed.Space)){NET.rematch[me]=true;relay({t:'rematch'});sfx('confirm');}
  else if(pressed.Escape){relay({t:'reselect'});onlineSelect();return;}
  if(NET.rematch[0]&&NET.rematch[1]&&me===0){NET.rematch=[false,false];const stage=Math.random()*STAGES.length|0,c=[...G.sel.c];const D=calcDelay();relay({t:'start',stage,c,D});beginOnlineMatch(stage,c,D);}
}
function stepOnlineMenu(){if(pressed.Escape&&document.activeElement!==oCode){netLeave();G.screen='title';uiOnline();}}

/* ---------- screens: logic ---------- */
function startMatch(){
  G.f=[makeFighter(ROSTER[G.sel.c[0]],0),makeFighter(ROSTER[G.sel.c[1]],1)];
  G.wins=[0,0];G.round=1;G.winner=-1;G.stage=STAGES[G.mode==='online'?NET.stage:Math.random()*STAGES.length|0];
  G.screen='fight';startRound();

function startRound(){

function stepTitle(){
  if(pressed.Digit1||pressed.Numpad1||pressed.Enter||pressed.Space||pressed.KeyF){G.mode='cpu';toSelect();}
  else if(pressed.Digit2||pressed.Numpad2){G.mode='2p';toSelect();}

}
function toSelect(){G.screen='select';G.sel={c:[...G.last],done:[false,false],go:0};sfx('confirm');}
function stepSelect(){
  if(G.mode==='online')return stepOnlineSelect();
  const S=G.sel;
  if(pressed.Escape){if(S.done[1]&&!S.go)S.done[1]=false;else if(S.done[0]&&!S.go)S.done[0]=false;else G.screen='title';return;}
  if(S.go){if(--S.go===0){G.last=[...S.c];G.screen='vs';G.vsT=0;}return;}
  const ctrl=G.mode==='cpu'?[[MAP.p1,MAP.p2],[MAP.p1,MAP.p2]]:[[MAP.p1],[MAP.p2]];
  for(let i=0;i<2;i++){
    if(S.done[i])continue;
    if(G.mode==='cpu'&&i===1&&!S.done[0])continue;
    const m=ctrl[i];let c=S.c[i];
    if(navP(m,'left'))c=(c+9)%10;if(navP(m,'right'))c=(c+1)%10;if(navP(m,'up')||navP(m,'down'))c=(c+5)%10;
    if(c!==S.c[i]){S.c[i]=c;sfx('select');}
    if(okP(m)){S.done[i]=true;sfx('confirm');if(G.mode==='cpu')break;}
  }
  if(S.done[0]&&S.done[1])S.go=30;
}
function stepVs(){G.vsT++;if(G.vsT>130||(G.vsT>20&&(okP([MAP.p1,MAP.p2]))))startMatch();}
function stepFight(){
  const online=G.mode==='online';
  if(!online&&(pressed.KeyP||pressed.Escape)){if(G.phase!=='over'){G.paused=!G.paused;return;}}
  if(G.paused){if(pressed.KeyQ){G.paused=false;G.screen='select';G.sel={c:[...G.last],done:[false,false],go:0};}return;}
  if(superFreeze){if(--superFreeze.t<=0)superFreeze=null;return;}
  if(hitstop>0){hitstop--;return;}
  if(slowmo>0){slowmo--;if(slowmo%2)return;}
  G.phaseT++;
  const [a,b]=G.f;
  if(G.phase==='intro'&&G.phaseT>=100){G.phase='play';G.phaseT=0;}
  const live=G.phase==='play';
  const ia=!live?EMPTY:online?decodeInput(NET.inputs[0]):readInput(G.mode==='cpu'?[MAP.p1,MAP.p2]:[MAP.p1]);
  const ib=!live?EMPTY:online?decodeInput(NET.inputs[1]):G.mode==='cpu'?aiInput(b,a):readInput([MAP.p2]);
  updateFighter(a,b,ia);updateFighter(b,a,ib);pushApart(a,b);
  updateProjectiles();
  if(shake>0)shake*=.85;if(shake<.3)shake=0;if(whiteFlash>0)whiteFlash--;
  if(live&&G.phaseT%60===0&&G.timer>0){G.timer--;if(G.timer===0){G.phase='ko';G.phaseT=0;G.timeOver=true;}}
  if(G.phase==='ko'){
    if(G.phaseT===1){
      const pa=a.hp/a.maxHp,pb=b.hp/b.maxHp;
      G.roundWinner=(a.hp<=0&&b.hp<=0)||(pa===pb)?-1:pa>pb?0:1;
      if(G.roundWinner>=0)G.wins[G.roundWinner]++;
    }
    if(G.phaseT>60&&G.roundWinner>=0){const w=G.f[G.roundWinner];if(w.onGround&&w.state!=='attack'&&w.state!=='hurt'){w.state='win';w.vx=0;}}
    if(G.phaseT>170){
      G.timeOver=false;
      if(G.wins[0]>=2||G.wins[1]>=2||G.round>=5){G.winner=G.wins[0]===G.wins[1]?-1:G.wins[0]>G.wins[1]?0:1;G.screen='result';G.resT=0;}
      else{G.round++;startRound();}
    }
  }
}
function stepResult(){
  if(G.mode==='online')return stepOnlineResult();
  G.resT++;
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;}parts=parts.filter(p=>p.life>0);
  if(G.resT>30){if(pressed.Enter||pressed.Digit1||pressed.Digit6||pressed.Numpad1||pressed.Space){G.screen='vs';G.vsT=0;}else if(pressed.Escape){G.screen='select';G.sel={c:[...G.last],done:[false,false],go:0};}}
}
function step(){
  G.t++;

/* ---------- rendering ---------- */
function poseOf(f){
  const P={pose:'idle',b:0,step:0,t:f.t,flash:f.flash>0,ext:0,active:false};
  switch(f.state){
  case 'idle':P.b=(f.t>>4)%2;if(f.guard)P.pose='block';break;
  case 'walk':P.pose='walk';P.step=(f.t>>3)%2;break;
  case 'jump':P.pose='jump';break;
  case 'hurt':P.pose='hurt';break;
  case 'block':P.pose='block';break;
  case 'ko':P.pose='ko';P.lying=f.onGround||f.vy>0;break;
  case 'win':P.pose='win';P.b=(f.t>>3)%2;break;
  case 'attack':{const m=f.move,mt=f.mt;
    if(mt<m.st)P.pose=m.pose==='cast'?'cast':'windup';
    else if(mt<m.st+m.ac+6){P.pose=m.pose||'cast';P.active=mt<m.st+m.ac;P.ext=m.ext||0;if(m.gatling&&P.active)P.ext=6+((mt*7)%Math.max(4,m.ext-6));}
    else P.pose='idle';
    if(m.type==='sky'&&f.ch.body==='pika')P.spark=1;
    break;}
  }
  if(!f.onGround&&(P.pose==='idle'||P.pose==='walk'))P.pose='jump';
  return P;
}
function handPos(f){return{x:f.x+f.facing*(f.w/2+8),y:f.y+f.ch.handY};}

  if(m.type==='beam'){

function drawBeam(f,m,prog){

function statRows(ch,x,y,col){
  const s=ch.stats;const rows=[['HP',(s.hp-70)/65],['POW',(s.pow-.85)/.55],['DEF',(s.def-.75)/.5],['SPD',(s.spd-.8)/.85],['JMP',(s.jump-.8)/.55]];
  rows.forEach(([l,v],i)=>{text(l,x,y+i*7,'#8f88b8',1,'left',null);bar(x+16,y+i*7,54,4,Math.max(.12,Math.min(1,v)),col,'#221d3e');});
}
function drawSelect(){
  ctx.fillStyle='#120e26';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1a1536';for(let i=-H;i<W;i+=16){const o=(G.t>>1)%16;for(let y=0;y<H;y+=2)ctx.fillRect(i+o+y,y,6,2);}
  text('CHOOSE YOUR FIGHTER',160,4,'#ffe84a',2,'center');
  if(G.mode==='online'){text('ROOM '+NET.code,3,4,'#8f88b8',1,'left',null);const pm=pingMs();if(pm!=null)text('LAG '+Math.round(pm)+'MS',317,4,pm<90?'#7ee08a':pm<180?'#ffd27a':'#ff8a8a',1,'right',null);}
  const S=G.sel;
  ROSTER.forEach((ch,i)=>{
    const cx=80+(i%5)*32+1,cy=20+(i/5|0)*32;
    ctx.fillStyle='#000';ctx.fillRect(cx-1,cy-1,32,32);ctx.fillStyle=ch.color;ctx.fillRect(cx,cy,30,30);
    alpha(.45,()=>{ctx.fillStyle='#000';ctx.fillRect(cx,cy+15,30,15);});
    ctx.save();ctx.beginPath();ctx.rect(cx,cy,30,30);ctx.clip();drawSprite(ch,cx+15,cy+ch.portY,1,{pose:'idle',t:G.t,b:0});ctx.restore();
  });
  const cols=['#ff3a3a','#3a8aff'];
  for(let i=1;i>=0;i--){
    if(G.mode==='cpu'&&i===1&&!S.done[0])continue;
    const c=S.c[i],cx=80+(c%5)*32+1,cy=20+(c/5|0)*32,blink=S.done[i]||G.t%20<14;
    if(blink){ctx.strokeStyle=cols[i];ctx.lineWidth=2;const inset=i===1&&S.c[0]===S.c[1]?2:0;ctx.strokeRect(cx+inset-1,cy+inset-1,32-inset*2,32-inset*2);}
    text(plabel(i),i===0?cx+1:cx+29,cy+(i===0?1:24),cols[i],1,i===0?'left':'right');
  }
  for(let i=0;i<2;i++){
    if(G.mode==='cpu'&&i===1&&!S.done[0]){text('PICK YOUR',280,60,'#8f88b8',1,'center');text('OPPONENT NEXT',280,68,'#8f88b8',1,'center');continue;}
    const ch=ROSTER[S.c[i]],px=i?280:40,f=i?-1:1;
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(px-38,24,76,96);
    const P={pose:S.done[i]?'win':'idle',t:G.t,b:(G.t>>4)%2};
    drawSprite(ch,px,118,f,P,{scale:2});
    text(ch.name,px,124,i?'#8ac0ff':'#ff8a8a',ch.name.length>7?1:2,'center');
    text(ch.from,px,ch.name.length>7?132:135,'#8f88b8',1,'center',null);
    statRows(ch,px-36,144,i?'#3a9aff':'#ff4a4a');
  }
  const p1=ROSTER[S.c[0]],p2=ROSTER[S.c[1]];
  drawMoveListC(p1,84,88,plabel(0),keyLabels(0),'#ff6a6a');
  if(!(G.mode==='cpu'&&!S.done[0]))drawMoveListC(p2,84,134,plabel(1),keyLabels(1),'#6aaaff');
  else text(touchUI?'1: LOCK IN     II: BACK':'1 / ENTER: LOCK IN     ESC: BACK',160,170,'#8f88b8',1,'center',null);
  if(S.go)alpha(1-S.go/30,()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);});
}
function plabel(i){return G.mode==='cpu'?(i?'CPU':'YOU'):G.mode==='online'?(i===NET.side?'YOU':'RIVAL'):(i?'2P':'1P');}
function keyLabels(i){const P1=['4','5','2','1','3'],P2=['9','0','7','6','8'];return G.mode==='cpu'?(i?null:P1):G.mode==='online'?(i===NET.side?P1:null):(i?P2:P1);}
function drawMoveListC(ch,x,y,label,keysL,col){
  text(label,x,y,col,1);text(keysL?'KEY  MOVE':'MOVE',x+16,y,'#8f88b8',1,'left',null);text('DMG',x+152,y,'#8f88b8',1,'right',null);
  KEY_ORDER.forEach((i,n)=>{const m=ch.moves[i],yy=y+8+n*7;text(keysL?keysL[i]:' ',x+16,yy,'#ffffff',1);text(m.name,x+36,yy,m.super?'#ffe84a':'#d8d4f0',1);text(String(m.dmg),x+152,yy,'#8f88b8',1,'right');});
}
function drawTitle(){
  drawStage(STAGES[1],G.t);
  alpha(.45,()=>{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);});
  const a=ROSTER[(G.t/180|0)%10],b=ROSTER[((G.t/180|0)+5)%10];
  drawSprite(a,60,GROUND,1,{pose:'idle',t:G.t,b:(G.t>>4)%2});drawSprite(b,260,GROUND,-1,{pose:'idle',t:G.t,b:(G.t>>4)%2});
  text('ANIME',160,18,'#ff4a4a',6,'center','#3a0a0a');
  text('CLASH',160,52,'#ffe84a',6,'center','#5a3a00');
  text('PIXEL BRAWL OF THE ANIME WORLDS',160,86,'#ffffff',1,'center');
  if(touchUI){if(G.t%40<28)text('CHOOSE A MODE BELOW',160,110,'#ffffff',2,'center');}
  else{if(G.t%40<28){text('PRESS 1 - VS CPU',160,98,'#ffffff',2,'center');}
  text('PRESS 2 - 2 PLAYERS',160,112,'#c8c0f0',2,'center');text('PRESS 3 - ONLINE',160,126,'#8ae08a',2,'center');}
  text(touchUI?'STICK: MOVE AND JUMP     BUTTONS: ATTACK':'P1: WASD + 1 2 3 4 5     P2: ARROWS + 6 7 8 9 0',160,146,'#8f88b8',1,'center');
  text('1 SIGNATURE  2 SPECIAL  3 SUPER  4 LIGHT  5 HEAVY',160,154,'#8f88b8',1,'center');
}
function drawVs(){
  const S=G.sel,a=ROSTER[S.c[0]],b=ROSTER[S.c[1]],k=Math.min(1,G.vsT/20);
  ctx.fillStyle=a.color;ctx.fillRect(0,0,W/2,H);ctx.fillStyle=b.color;ctx.fillRect(W/2,0,W/2,H);
  alpha(.55,()=>{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);});
  ctx.fillStyle='#000';for(let y=0;y<H;y+=4)ctx.fillRect(W/2-6+((y/4)%2?2:-2),y,12,4);
  drawSprite(a,Math.round(-40+120*k),130,1,{pose:'idle',t:G.vsT,b:0},{scale:2});
  drawSprite(b,Math.round(W+40-120*k),130,-1,{pose:'idle',t:G.vsT,b:0},{scale:2});
  text(a.name,80,140,'#ffffff',2,'center');text(a.from,80,152,'#ffd8d8',1,'center');
  text(b.name,240,140,'#ffffff',2,'center');text(b.from,240,152,'#d8e8ff',1,'center');
  if(G.vsT>15)text('VS',160,60,G.t%8<4?'#ffe84a':'#ff4a4a',6,'center');
}
function drawResult(){
  drawStage(G.stage,G.t);alpha(.6,()=>{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);});
  if(G.winner<0){text('DRAW GAME',160,60,'#ffffff',4,'center');}
  else{
    const ch=G.f[G.winner].ch;
    alpha(.4,()=>pc(160,100,40,ch.color));
    drawSprite(ch,160,140,1,{pose:'win',t:G.t,b:(G.t>>3)%2},{scale:2});
    text(ch.name+' WINS!',160,8,'#ffe84a',3,'center');
    const who=G.mode==='cpu'?(G.winner===0?'YOU WIN':'CPU WINS'):G.mode==='online'?(G.winner===NET.side?'YOU WIN':'RIVAL WINS'):(G.winner===0?'PLAYER 1':'PLAYER 2');
    text(who,160,28,G.winner===0?'#ff8a8a':'#8ac0ff',1,'center');
    const q=ch.quote.toUpperCase();text('"'+q+'"',160,148,'#ffffff',1,'center');
  }
  if(G.mode==='online'&&G.resT>30){if(NET.rematch[NET.side])text(NET.rematch[1-NET.side]?'STARTING...':'WAITING FOR YOUR RIVAL...',160,166,'#8ac0ff',1,'center');else if(G.t%40<28)text(touchUI?'1: REMATCH    II: CHARACTER SELECT':'1 / ENTER: REMATCH    ESC: CHARACTER SELECT',160,166,'#c8c0f0',1,'center');if(NET.rematch[1-NET.side]&&!NET.rematch[NET.side])text('YOUR RIVAL WANTS A REMATCH',160,40,'#ffe84a',1,'center');}
  else if(G.resT>30&&G.t%40<28)text(touchUI?'1: REMATCH    II: CHARACTER SELECT':'ENTER: REMATCH    ESC: CHARACTER SELECT',160,166,'#c8c0f0',1,'center');
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  if(G.screen==='title')drawTitle();else if(G.screen==='select')drawSelect();else if(G.screen==='vs')drawVs();else if(G.screen==='fight')drawFightScreen();else if(G.screen==='result')drawResult();
  if(muted)text('MUTED',316,2,'#8f88b8',1,'right');
}

let last=performance.now(),acc=0;const DT=1000/60;
function loop(ts){
  acc+=Math.min(100,ts-last);last=ts;
  while(acc>=DT){step();acc-=DT;for(const k in pressed)delete pressed[k];}
  render();syncTouch();requestAnimationFrame(loop);
}
/* ---------- touch controls ---------- */
const touchEl=document.getElementById('touch'),pads=[document.getElementById('pad1'),document.getElementById('pad2')],
  tmid=document.getElementById('tmid'),tmenu=document.getElementById('tmenu'),tquit=document.getElementById('tquit'),
  supBtns=[...touchEl.querySelectorAll('.sup')];
function enableTouch(){if(touchUI)return;touchUI=true;touchEl.hidden=false;document.querySelector('.keys').hidden=true;tKey='';fit();}
function unlockAudio(){initAudio();if(AC&&AC.state==='suspended')AC.resume();}
function vPress(c){if(!keys[c])pressed[c]=true;keys[c]=true;}
function vRelease(c){keys[c]=false;}
touchEl.querySelectorAll('button[data-code]').forEach(b=>{
  const c=b.dataset.code;let id=null;
  b.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();id=e.pointerId;try{b.setPointerCapture(id);}catch(_){}b.classList.add('on');vPress(c);});
  const up=e=>{if(id===null||e.pointerId!==id)return;id=null;b.classList.remove('on');vRelease(c);};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
touchEl.querySelectorAll('.stick').forEach(st=>{
  const map=st.dataset.p==='1'?{l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS'}:{l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown'};
  const nub=st.querySelector('.nub');let id=null;
  const set=d=>{for(const k of['l','r','u','d']){if(d[k])vPress(map[k]);else vRelease(map[k]);}};
  const move=e=>{const r=st.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    const m=r.width*.32,len=Math.hypot(dx,dy);if(len>m){dx*=m/len;dy*=m/len;}
    nub.style.transform=`translate(${dx}px,${dy}px)`;const t=r.width*.1;
    set({l:dx<-t,r:dx>t,u:dy<-t*1.8,d:dy>t*1.8});};
  st.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();id=e.pointerId;try{st.setPointerCapture(id);}catch(_){}move(e);});
  st.addEventListener('pointermove',e=>{if(e.pointerId===id)move(e);});
  const end=e=>{if(e.pointerId!==id)return;id=null;nub.style.transform='';set({});};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);st.addEventListener('lostpointercapture',end);
});
let tKey='';
function syncTouch(){
  if(!touchUI)return;
  const k=G.screen+'|'+G.mode+'|'+G.paused;
  if(k!==tKey){tKey=k;const title=G.screen==='title',menu=G.screen==='online',duo=!title&&G.mode==='2p';
    tmenu.hidden=!title;tmid.hidden=title||menu;pads[0].hidden=title||menu;pads[1].hidden=!duo;
    touchEl.classList.toggle('solo',!title&&!duo);touchEl.classList.toggle('duo',duo);
    tquit.hidden=!(G.screen==='fight'&&G.paused);}
  if(G.mode==='online')tquit.hidden=!(G.screen==='fight'&&G.leaveAsk>0);
  for(let i=0;i<2;i++)supBtns[i].classList.toggle('ready',G.screen==='fight'&&!!G.f[i]&&G.f[i].meter>=100);
}
if(navigator.maxTouchPoints>0||matchMedia('(pointer: coarse)').matches)enableTouch();
addEventListener('touchstart',enableTouch,{passive:true});
cv.focus();
requestAnimationFrame(loop);
})();
</script>
